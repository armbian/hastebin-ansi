host: "0.0.0.0"
port: 7777
key_length: 10
max_length: 4000000
static_max_age: 3
expiration: 0
recompress_static_assets: false
key_generator: "phonetic"

delete_after:
  enable: true

storage:
  type: "file"
  file_path: "./test"

documents:
  - key: "about"
    path: "/app/about.md"

rate_limiting:
  enable: true
  limit: 500
  window: 15
  # Keep 0 when the service is directly public. Set only behind trusted proxies.
  trusted_proxy_count: 0

logging:
  level: "info"
  type: "text"
  colorize: true
