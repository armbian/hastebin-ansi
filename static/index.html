<html lang="en">

<head>

    <title>hastebin</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css"
        integrity="sha512-rO+olRTkcf304DQBxSWxln8JXCzTHlKnIdnMUwYvQa9/Jd4cQaNkItIUj6Z4nvW1dqK0SKXLbn9h4KwZTNtAyw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="solarized_dark.css" />
    <link rel="stylesheet" type="text/css" href="application.css?v=0.0.9" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"
        integrity="sha512-jGsMH83oKe9asCpkOVkBnUrDDTp8wl+adkB2D+//JtlxO4SrLoJdhbOysIFQJloQFD+C4Fl1rMsQZF76JjV0eQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"
        integrity="sha512-bgHRAiTjGrzHzLyKOnpFvaEpGzJet3z4tZnXGjpsCcqOnAH6VGUx9frc5bcIhKTVLEiCO6vEhNAgx5jtLUYrfA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script type="text/javascript" src="ansi-to-html.js?v=0.0.9"></script>
    <script type="text/javascript" src="application.js?v=0.0.9"></script>

    <meta name="robots" content="noindex,nofollow" />

    <script type="text/javascript">
        var app = null;
        // Handle pops
        var handlePop = function (evt) {
            var path = evt.target.location.pathname;
            if (path === '/') {
                app.newDocument(true);
            } else {
                app.loadDocument(path.substring(1, path.length));
            }
        };
        // Set up the pop state to handle loads, skipping the first load
        // to make chrome behave like others:
        // http://code.google.com/p/chromium/issues/detail?id=63040
        setTimeout(function () {
            window.onpopstate = function (evt) {
                try {
                    handlePop(evt);
                } catch (err) {
                    /* not loaded yet */
                }
            };
        }, 1000);
        // Construct app and load initial path
        $(function () {
            app = new haste('hastebin', {
                twitter: false
            });
            $.getJSON('/api/config', function (config) {
                if (config.delete_after_enabled) {
                    $('#delete-after-control').show();
                }
            });
            handlePop({
                target: window
            });
        });
    </script>

</head>

<body>
    <ul id="messages"></ul>

    <button id="menu-toggle" type="button" aria-controls="key" aria-expanded="true" aria-label="Toggle paste controls">
        <span aria-hidden="true">☰</span>
    </button>
    <div id="key">
        <div id="pointer" style="display:none;"></div>
        <div id="box1">
            <!--suppress HtmlUnknownTarget -->
            <a href="/about.md" class="logo" aria-label="Armbian Hastebin home"></a>
        </div>
        <label id="delete-after-control" class="delete-after-label" for="delete-after" style="display:none">Delete after
            <select id="delete-after">
                <option value="never">Never</option>
                <option value="10m">10 minutes</option>
                <option value="1h">1 hour</option>
                <option value="24h">1 day</option>
                <option value="168h">7 days</option>
            </select>
        </label>
        <div id="box2">
            <button class="save function button-picture" aria-label="Save paste" title="Save">Save</button>
            <button class="new function button-picture" aria-label="Create new paste" title="New">New</button>
            <button class="duplicate function button-picture" aria-label="Duplicate and edit paste"
                title="Duplicate & Edit">Duplicate & Edit</button>
            <button class="raw function button-picture" aria-label="View raw text" title="Just Text">Just Text</button>
            <button class="twitter function button-picture" aria-label="Share on Twitter"
                title="Twitter">Twitter</button>
        </div>
        <div id="box3" style="display:none;">
            <div class="label"></div>
            <div class="shortcut"></div>
        </div>
    </div>

    <div id="linenos"></div>
    <pre id="box" style="display:none;" class="hljs" tabindex="0"><code></code></pre>
    <!--suppress HtmlFormInputWithoutLabel -->
    <textarea spellcheck="false" style="display:none;"></textarea>

</body>

</html>
